name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # false: run every Node version to completion and report all results,
      # rather than cancelling the rest of the matrix the moment one fails.
      fail-fast: false
      matrix:
        # 22.x = current Maintenance LTS, 24.x = current Active LTS.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (for the pinned Yarn version)
        run: corepack enable

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn typecheck:examples
      - run: yarn lint // WIP
      - run: yarn test
      - run: yarn build